name: BPU-8 R2A capacity-knee preregistration safety
on:
  push:
    branches: [little-v052-bpu8-r2a-capacity-knee]
  pull_request:
    paths:
      - 'docs/bpu8_r2a_capacity_knee_v01.json'
      - 'configs/02_little_v052_rv64_proxy.py'
      - 'scripts/bpu_b8_r2a_capacity_full19.py'
      - 'tests/bpu8/test_r2a_capacity.py'
      - '.github/workflows/bpu8-r2a-capacity.yaml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Syntax, matrix, instantiated config and fail-closed parser tests
        run: |
          python3 -m py_compile scripts/bpu_b8_r2a_capacity_full19.py configs/02_little_v052_rv64_proxy.py tests/bpu8/test_r2a_capacity.py
          python3 -m unittest discover -s tests/bpu8 -p 'test_*.py' -v
          python3 scripts/bpu_b8_r2a_capacity_full19.py --list | grep -F 'BPU8_R2A_JOBS_PLANNED=209 FULL19=True'
          python3 scripts/bpu_b8_r2a_capacity_full19.py --smoke --list | grep -F 'BPU8_R2A_JOBS_PLANNED=22 FULL19=False'
          python3 scripts/bpu_b8_r2a_capacity_full19.py --list | sed -n '1p' | grep -F 'tg5_45'
      - name: R1 preserved and R2A shares unchanged TAGEBase
        run: |
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path('configs/02_little_v052_rv64_proxy.py').read_text()
          assert 'BPU8_R2A_GEO_TYPES' in s and 'BPU8_ALL_GEO_TYPES' in s
          assert 'elif bp_type in BPU8_ALL_GEO_TYPES:' in s
          block=s.split('elif bp_type in BPU8_ALL_GEO_TYPES:',1)[1].split('elif bp_type == "tage5-iso45k":',1)[0]
          assert 'LittleTAGE5Iso45K()' in block
          assert 'cpu.branchPred.conditionalBranchPred = pred' in block
          assert 'c3PcChooser' not in block and 'perceptronEnabled' not in block
          matrix=pathlib.Path('docs/bpu8_tage_isobit_r1.json').read_bytes()
          assert matrix and b'BPU8_TAGE_ISOBIT_R1' in matrix
          PY
          git diff --check HEAD^ HEAD
